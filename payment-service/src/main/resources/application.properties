spring.application.name=payment-service

server.port=8081

payment.account.initial-balance=50000
payment.account.balances.bob=1000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=payment-service

management.endpoints.web.exposure.include=health
