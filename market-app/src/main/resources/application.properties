spring.application.name=my-market-app

server.port=8080

spring.r2dbc.url=r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.sql.init.mode=always

spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-in-memory-size=1MB

market.images.dir=./uploaded-images

market.payment.base-url=http://localhost:8081
market.payment.timeout=3s
market.payment.client-registration-id=payment-service

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

market.cache.items-ttl=2m

market.auth.base-url=http://localhost:9000
market.auth.client-id=market-app
market.auth.client-secret=market-app-secret

spring.security.oauth2.client.registration.payment-service.provider=market-auth
spring.security.oauth2.client.registration.payment-service.client-id=${market.auth.client-id}
spring.security.oauth2.client.registration.payment-service.client-secret=${market.auth.client-secret}
spring.security.oauth2.client.registration.payment-service.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service.scope=payments
spring.security.oauth2.client.provider.market-auth.token-uri=${market.auth.base-url}/oauth2/token
