services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: payment-service
    ports:
      - "8081:8081"
    environment:
      PAYMENT_ACCOUNT_INITIAL_BALANCE: "50000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/api/balance"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  market-app:
    build:
      context: .
      dockerfile: market-app/Dockerfile
    image: my-market-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MARKET_PAYMENT_BASE_URL: http://payment-service:8081
    volumes:
      - market-images:/app/uploaded-images
    depends_on:
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  market-images:
