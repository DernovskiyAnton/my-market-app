spring.application.name=my-market-app

server.port=8080
# Идентификатор сессии (нужен для flash-атрибутов) передаётся только в cookie, не в URL
server.servlet.session.tracking-modes=cookie

# База данных H2 в памяти
spring.datasource.url=jdbc:h2:mem:market;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Схема и начальные данные накатываются скриптами schema.sql и data.sql,
# Hibernate только проверяет соответствие сущностей схеме
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Консоль H2 для отладки: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Загрузка файлов (импорт товаров и изображений)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Каталог для изображений, загруженных через импорт
market.images.dir=./uploaded-images
